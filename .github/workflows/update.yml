name: Update DUNCAN Ratings

on:
  schedule:
    - cron: '13 15 * * *'   # 15:13 UTC daily - leads US-sport block; basketball-reference (sports-reference family, rate-limited)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install cython numpy
          pip install --no-build-isolation -r requirements.txt

      # duncan_ratings.csv + daily_standings.csv are duncan.py's incremental
      # scratchpads (regenerable build artifacts, NOT source). They were
      # re-committed daily as big uncompressed CSVs that rewrite most rows every
      # run (ratings shift), so git could barely delta them - ~40MB/day of bloat.
      # They now live in the Actions cache. A miss (first run / eviction) is safe:
      # duncan.py rebuilds from scratch (try/except FileNotFoundError).
      - name: Restore ratings caches
        uses: actions/cache/restore@v4
        with:
          path: |
            duncan_ratings.csv
            daily_standings.csv
          key: duncan-caches-${{ github.run_id }}
          restore-keys: duncan-caches-

      - name: Run ratings engine
        run: python duncan.py

      - name: Save ratings caches
        uses: actions/cache/save@v4
        with:
          path: |
            duncan_ratings.csv
            daily_standings.csv
          key: duncan-caches-${{ github.run_id }}

      - name: Generate web data
        run: python generate_data.py

      - name: Commit and push updated data
        run: |
          git config user.name  "DUNCAN Bot"
          git config user.email "duncan-bot@users.noreply.github.com"
          git add loaded_nba_games.csv all_nba_games.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
